<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fitts' Law: Screen Edge vs. Floating Target</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #121214;
      color: #f0f0f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      position: relative;
    }
    #dashboard {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 24px 32px;
      background: rgba(26, 26, 30, 0.95);
      border: 1px solid #33333a;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      text-align: center;
      z-index: 1000;
      width: 400px;
    }
    #dashboard h2 {
      font-size: 20px;
      margin-bottom: 12px;
      color: #60a5fa;
    }
    #dashboard p {
      font-size: 13px;
      line-height: 1.6;
      color: #9ca3af;
      margin-bottom: 16px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      margin: 6px 0;
      font-size: 13px;
      color: #e5e7eb;
    }
    button.btn {
      margin-top: 14px;
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.btn:hover {
      background: #1d4ed8;
    }
    #start-circle {
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #10b981;
      transform: translate(-50%, -50%);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: white;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
      z-index: 200;
    }
    #target-bar {
      position: absolute;
      background: #ef4444;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      color: white;
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.35);
      z-index: 200;
    }
  </style>
</head>
<body>
  <div id="dashboard">
    <h2>Screen Edge Fitts' Law Test</h2>
    <p>點擊綠色「起點」圓圈後，以最快速度直線往上點擊紅色「目標長條」。</p>
    <div class="status-row"><span>目前階段:</span><strong id="condition-text">準備開始</strong></div>
    <div class="status-row"><span>進度:</span><strong id="progress-text">0 / 54</strong></div>
    <button id="start-btn" class="btn" onclick="startExperiment()">開始測試</button>
    <button id="export-btn" class="btn" style="display:none; background:#059669;" onclick="exportCSV()">下載實驗數據 (CSV)</button>
  </div>

  <div id="start-circle" onclick="handleStartClick()">起點</div>
  <div id="target-bar" onclick="handleTargetClick()">目標</div>

  <script>
    const distances = [250, 420, 600];
    const widths = [24, 48, 80];
    const conditions = ["Edge", "Floating"];
    const repeats = 3;

    let trials = [];
    let currentIndex = -1;
    let startTime = 0;
    let dataset = [];

    function initQueue() {
      trials = [];
      conditions.forEach(cond => {
        distances.forEach(d => {
          widths.forEach(w => {
            for (let r = 0; r < repeats; r++) {
              trials.push({ condition: cond, D: d, W: w });
            }
          });
        });
      });
      for (let i = trials.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [trials[i], trials[j]] = [trials[j], trials[i]];
      }
    }

    function startExperiment() {
      initQueue();
      dataset = [];
      currentIndex = 0;
      document.getElementById("dashboard").style.display = "none";
      prepareTrial();
    }

    function prepareTrial() {
      if (currentIndex >= trials.length) {
        completeExperiment();
        return;
      }

      const trial = trials[currentIndex];
      const winW = window.innerWidth;
      const targetBar = document.getElementById("target-bar");
      const startCircle = document.getElementById("start-circle");

      const barWidth = 360;
      const targetX = (winW - barWidth) / 2;
      const targetY = trial.condition === "Edge" ? 0 : 80;

      targetBar.style.left = `${targetX}px`;
      targetBar.style.top = `${targetY}px`;
      targetBar.style.width = `${barWidth}px`;
      targetBar.style.height = `${trial.W}px`;
      targetBar.style.display = "none";

      const targetCenterY = targetY + trial.W / 2;
      const startX = winW / 2;
      const startY = targetCenterY + trial.D;

      startCircle.style.left = `${startX}px`;
      startCircle.style.top = `${startY}px`;
      startCircle.style.display = "flex";
    }

    function handleStartClick() {
      document.getElementById("start-circle").style.display = "none";
      document.getElementById("target-bar").style.display = "flex";
      startTime = performance.now();
    }

    function handleTargetClick() {
      const endTime = performance.now();
      const movementTime = endTime - startTime;
      const trial = trials[currentIndex];

      const id = Math.log2(trial.D / trial.W + 1);

      dataset.push({
        Trial: currentIndex + 1,
        Condition: trial.condition,
        Distance_px: trial.D,
        Width_px: trial.W,
        ID_bits: id.toFixed(3),
        MovementTime_ms: movementTime.toFixed(2)
      });

      document.getElementById("target-bar").style.display = "none";
      currentIndex++;
      setTimeout(prepareTrial, 120);
    }

    function completeExperiment() {
      const db = document.getElementById("dashboard");
      db.style.display = "block";
      document.getElementById("condition-text").innerText = "已完成全部測試";
      document.getElementById("progress-text").innerText = `${dataset.length} / ${dataset.length}`;
      document.getElementById("start-btn").style.display = "none";
      document.getElementById("export-btn").style.display = "block";
    }

    function exportCSV() {
      if (!dataset.length) return;
      const header = ["Trial", "Condition", "Distance_px", "Width_px", "ID_bits", "MovementTime_ms"];
      const rows = dataset.map(d => 
        [d.Trial, d.Condition, d.Distance_px, d.Width_px, d.ID_bits, d.MovementTime_ms].join(",")
      );
      const csvString = "data:text/csv;charset=utf-8," + [header.join(","), ...rows].join("\n");
      const link = document.createElement("a");
      link.href = encodeURI(csvString);
      link.download = "fitts_edge_experiment_data.csv";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
