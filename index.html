<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fitts' Law Experiment - Safety UI</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #f4f5f7; display: flex; flex-direction: column; align-items: center; }
    #experiment-box { position: relative; width: 900px; height: 500px; background: #ffffff; border: 2px solid #ddd; border-radius: 8px; overflow: hidden; margin-top: 15px; }
    .target { position: absolute; top: 50%; transform: translateY(-50%); background: #2563eb; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; user-select: none; }
    .target.inactive { background: #cbd5e1; color: #64748b; cursor: not-allowed; }
    #hud { width: 900px; display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    button.export-btn { background: #059669; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; }
    button.export-btn:disabled { background: #9ca3af; cursor: not-allowed; }
  </style>
</head>
<body>

  <h2>Fitts' Law: Prevent Accidental Triggering Experiment</h2>
  <div id="hud">
    <div id="status">Press <strong>Start</strong> to begin.</div>
    <div>
      <button id="start-btn" onclick="startExperiment()">Start Experiment</button>
      <button id="export-btn" class="export-btn" disabled onclick="exportCSV()">Export Aggregated CSV</button>
    </div>
  </div>

  <div id="experiment-box">
    <div id="target-left" class="target inactive">A</div>
    <div id="target-right" class="target inactive">B</div>
  </div>

  <script>
    const distances = [150, 300, 450];
    const widths = [24, 48, 80];
    const CLICKS_PER_CONDITION = 11; // 1st click ignored, 10 recorded
    
    let conditions = [];
    distances.forEach(d => widths.forEach(w => conditions.push({ A: d, W: w })));
    
    let currentConditionIndex = 0;
    let clickCountInCondition = 0;
    let activeTarget = 'left';
    let lastTimestamp = 0;
    let rawRecords = [];

    const box = document.getElementById('experiment-box');
    const tLeft = document.getElementById('target-left');
    const tRight = document.getElementById('target-right');
    const statusText = document.getElementById('status');
    const exportBtn = document.getElementById('export-btn');

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function setupCondition() {
      const c = conditions[currentConditionIndex];
      const centerX = box.clientWidth / 2;
      
      tLeft.style.width = `${c.W}px`;
      tLeft.style.height = `${c.W * 1.2}px`;
      tLeft.style.left = `${centerX - (c.A / 2) - (c.W / 2)}px`;

      tRight.style.width = `${c.W}px`;
      tRight.style.height = `${c.W * 1.2}px`;
      tRight.style.left = `${centerX + (c.A / 2) - (c.W / 2)}px`;

      setTargetActive('left');
      statusText.innerHTML = `Condition ${currentConditionIndex + 1}/9: Distance=${c.A}px, Width=${c.W}px. Target clicks: ${clickCountInCondition}/${CLICKS_PER_CONDITION - 1}`;
    }

    function setTargetActive(target) {
      activeTarget = target;
      if (target === 'left') {
        tLeft.classList.remove('inactive');
        tRight.classList.add('inactive');
      } else {
        tRight.classList.remove('inactive');
        tLeft.classList.add('inactive');
      }
    }

    function handleTargetClick(which) {
      if (which !== activeTarget) return;

      const now = performance.now();
      const c = conditions[currentConditionIndex];

      if (clickCountInCondition > 0) {
        const mt = Math.round(now - lastTimestamp);
        const id = Math.log2((2 * c.A) / c.W);
        rawRecords.push({ condition: currentConditionIndex + 1, A: c.A, W: c.W, ID: id.toFixed(3), MT: mt });
      }

      lastTimestamp = now;
      clickCountInCondition++;
      statusText.innerHTML = `Condition ${currentConditionIndex + 1}/9 | Tap ${clickCountInCondition}/${CLICKS_PER_CONDITION - 1}`;

      if (clickCountInCondition >= CLICKS_PER_CONDITION) {
        currentConditionIndex++;
        clickCountInCondition = 0;
        if (currentConditionIndex < conditions.length) {
          setupCondition();
        } else {
          finishExperiment();
          return;
        }
      } else {
        setTargetActive(activeTarget === 'left' ? 'right' : 'left');
      }
    }

    tLeft.addEventListener('mousedown', () => handleTargetClick('left'));
    tRight.addEventListener('mousedown', () => handleTargetClick('right'));

    function startExperiment() {
      conditions = shuffle(conditions);
      currentConditionIndex = 0;
      clickCountInCondition = 0;
      rawRecords = [];
      document.getElementById('start-btn').disabled = true;
      exportBtn.disabled = true;
      setupCondition();
    }

    function finishExperiment() {
      tLeft.classList.add('inactive');
      tRight.classList.add('inactive');
      statusText.innerHTML = "<strong>Experiment Complete!</strong> Please export your aggregated data.";
      exportBtn.disabled = false;
    }

    function exportCSV() {
      // Aggregate by Condition/ID to calculate Mean MT
      const grouped = {};
      rawRecords.forEach(r => {
        const key = `${r.A}_${r.W}_${r.ID}`;
        if (!grouped[key]) grouped[key] = { A: r.A, W: r.W, ID: r.ID, MTs: [] };
        grouped[key].MTs.push(r.MT);
      });

      let csvContent = "data:text/csv;charset=utf-8,A,W,ID,Mean_MT\n";
      Object.values(grouped).forEach(g => {
        const meanMT = (g.MTs.reduce((sum, val) => sum + val, 0) / g.MTs.length).toFixed(2);
        csvContent += `${g.A},${g.W},${g.ID},${meanMT}\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "fitts_law_aggregated_data.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
