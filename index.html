<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Game HUD Fitts' Law Study</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: #111827;
      --border: #1f2937;
      --attack: #ea580c;
      --attack-glow: #f97316;
      --config: #374151;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    /* Minimal Stats Bar (No big ugly title) */
    #top-bar {
      width: 900px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 20px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    #top-bar span {
      color: #fff;
      font-weight: 600;
    }

    /* Main Interaction Canvas */
    #canvas {
      position: relative;
      width: 900px;
      height: 520px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }

    /* Center Rest Position */
    #rest-station {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 140px;
      height: 48px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      z-index: 10;
      transition: all 0.15s ease;
    }
    #rest-station.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.5);
    }

    /* Target Buttons */
    .hud-target {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.05s ease;
    }
    .hud-target:active {
      transform: scale(0.95);
    }

    /* Prominent Attack Button - Guaranteed safe inside canvas */
    .target-attack {
      background: linear-gradient(135deg, #ea580c, #c2410c);
      color: #ffffff;
      border: 2px solid #fdba74;
      box-shadow: 0 0 16px rgba(234, 88, 12, 0.5);
      letter-spacing: 1px;
    }

    /* Compact Config Button - Positioned near edges */
    .target-config {
      background: var(--config);
      color: #94a3b8;
      border: 1px solid #4b5563;
      box-shadow: 0 0 6px rgba(0,0,0,0.4);
    }

    .hidden {
      display: none !important;
    }

    /* Bottom Control Bar */
    #bottom-bar {
      width: 900px;
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #guidance {
      font-size: 13px;
      color: var(--muted);
    }

    .btn {
      border: none;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-start {
      background: var(--accent);
      color: #090d16;
    }
    .btn-export {
      background: var(--success);
      color: #ffffff;
      margin-left: 8px;
    }
    .btn:disabled {
      background: #1f2937;
      color: #4b5563;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Minimal Stats Bar (Top right only) -->
  <div id="top-bar">
    <div>Condition: <span id="lbl-cond">Idle</span></div>
    <div>Trials: <span id="lbl-trials">0/10</span></div>
    <div>Misses: <span id="lbl-miss" style="color:var(--danger)">0</span></div>
  </div>

  <!-- Interactive Arena -->
  <div id="canvas">
    <div id="rest-station">REST POSITION</div>
    <div id="btn-attack" class="hud-target target-attack hidden">ATTACK</div>
    <div id="btn-config" class="hud-target target-config hidden">CFG</div>
  </div>

  <!-- Controls Footer -->
  <div id="bottom-bar">
    <div id="guidance">Click <strong>Start Session</strong> to begin.</div>
    <div>
      <button id="btn-start" class="btn btn-start" onclick="initStudy()">Start Session</button>
      <button id="btn-export" class="btn btn-export" disabled onclick="exportCSV()">Export Aggregated CSV</button>
    </div>
  </div>

  <script>
    // Systematically controlled A & W (Guaranteed inside canvas)
    // 9 Conditions: 3 Distances x 3 Widths
    const distances = [140, 210, 280]; // A (px) - Safely contained within 900x520 canvas
    const widths = [28, 54, 96];        // W (px): 28px for edge Config, 96px for Attack
    const TAPS_PER_COND = 11;          // 1st Warm-up discarded, 10 valid trials recorded

    let conditions = [];
    distances.forEach(d => widths.forEach(w => conditions.push({ A: d, W: w })));

    let condIndex = 0;
    let clickCount = 0;
    let state = 'IDLE';
    let currentRole = 'ATTACK';
    let startTimestamp = 0;
    let rawRecords = [];
    let misses = 0;

    const canvas = document.getElementById('canvas');
    const restStation = document.getElementById('rest-station');
    const btnAttack = document.getElementById('btn-attack');
    const btnConfig = document.getElementById('btn-config');
    const lblCond = document.getElementById('lbl-cond');
    const lblTrials = document.getElementById('lbl-trials');
    const lblMiss = document.getElementById('lbl-miss');
    const guidance = document.getElementById('guidance');
    const btnStart = document.getElementById('btn-start');
    const btnExport = document.getElementById('btn-export');

    function shuffle(arr) {
      return arr.sort(() => Math.random() - 0.5);
    }

    function setupCondition() {
      const c = conditions[condIndex];
      clickCount = 0;
      lblCond.textContent = `${condIndex + 1}/9 (A:${c.A}px, W:${c.W}px)`;
      lblTrials.textContent = `0/10`;

      // Assign role: Large is ATTACK, Small/Medium can be CONFIG
      currentRole = c.W >= 70 ? 'ATTACK' : 'CONFIG';

      const activeEl = currentRole === 'ATTACK' ? btnAttack : btnConfig;
      const inactiveEl = currentRole === 'ATTACK' ? btnConfig : btnAttack;

      const centerX = 450;
      const centerY = 260;

      let targetX = 0;
      let targetY = 0;

      if (currentRole === 'ATTACK') {
        // ATTACK: Placed prominently in the central horizontal action zone (never cut off)
        const side = Math.random() > 0.5 ? 1 : -1;
        targetX = centerX + (side * c.A) - (c.W / 2);
        targetY = centerY - 25; // Balanced vertically with rest station
      } else {
        // CONFIG: Positioned toward the corners or upper edge to simulate peripheral settings
        const cornerX = Math.random() > 0.5 ? 1 : -1;
        const cornerY = Math.random() > 0.5 ? -1 : 1;
        targetX = centerX + (cornerX * c.A * 1.1) - (c.W / 2);
        targetY = centerY + (cornerY * c.A * 0.7) - (c.W / 2);
      }

      // Strict boundaries to prevent clipping (margins of 20px)
      targetX = Math.max(20, Math.min(900 - c.W - 20, targetX));
      targetY = Math.max(20, Math.min(520 - 45 - 20, targetY));

      activeEl.style.width = `${c.W}px`;
      activeEl.style.height = `${Math.max(32, c.W * 0.6)}px`;
      activeEl.style.left = `${targetX}px`;
      activeEl.style.top = `${targetY}px`;
      activeEl.style.fontSize = c.W < 35 ? '10px' : '13px';
      activeEl.classList.remove('hidden');

      inactiveEl.classList.add('hidden');

      setStep('REST');
    }

    function setStep(next) {
      state = next;
      if (next === 'REST') {
        restStation.classList.add('active');
        btnAttack.style.pointerEvents = 'none';
        btnConfig.style.pointerEvents = 'none';
        guidance.textContent = "Click [REST POSITION] to center cursor.";
      } else {
        restStation.classList.remove('active');
        btnAttack.style.pointerEvents = 'auto';
        btnConfig.style.pointerEvents = 'auto';
        guidance.innerHTML = `Target: Click <strong style="color:${currentRole === 'ATTACK' ? 'var(--attack-glow)' : '#cbd5e1'}">[${currentRole}]</strong>`;
        startTimestamp = performance.now();
      }
    }

    restStation.addEventListener('mousedown', () => {
      if (state !== 'REST') return;
      setStep('TARGET');
    });

    function handleTargetClick(role) {
      if (state !== 'TARGET') return;

      const now = performance.now();
      const c = conditions[condIndex];

      // Drop first warm-up trial
      if (clickCount > 0) {
        const mt = Math.round(now - startTimestamp);
        const id = Math.log2((2 * c.A) / c.W);
        rawRecords.push({
          condIndex: condIndex + 1,
          Role: currentRole,
          A: c.A,
          W: c.W,
          ID: parseFloat(id.toFixed(3)),
          MT: mt
        });
      }

      clickCount++;
      lblTrials.textContent = `${Math.min(clickCount, 10)}/10`;

      if (clickCount >= TAPS_PER_COND) {
        condIndex++;
        if (condIndex < conditions.length) {
          setupCondition();
        } else {
          finishStudy();
        }
      } else {
        setStep('REST');
      }
    }

    btnAttack.addEventListener('mousedown', () => handleTargetClick('ATTACK'));
    btnConfig.addEventListener('mousedown', () => handleTargetClick('CONFIG'));

    // Miss clicks on background
    canvas.addEventListener('mousedown', (e) => {
      if (state === 'TARGET' && e.target === canvas) {
        misses++;
        lblMiss.textContent = misses;
        canvas.style.borderColor = '#ef4444';
        setTimeout(() => { canvas.style.borderColor = '#1f2937'; }, 120);
      }
    });

    function initStudy() {
      conditions = shuffle(conditions);
      condIndex = 0;
      misses = 0;
      rawRecords = [];
      btnStart.disabled = true;
      btnExport.disabled = true;
      lblMiss.textContent = '0';
      setupCondition();
    }

    function finishStudy() {
      restStation.classList.remove('active');
      btnAttack.classList.add('hidden');
      btnConfig.classList.add('hidden');
      lblCond.textContent = "Completed";
      guidance.innerHTML = "<span style='color:var(--success); font-weight:600;'>Session complete. Export aggregated data below.</span>";
      btnExport.disabled = false;
    }

    function exportCSV() {
      const map = {};
      rawRecords.forEach(r => {
        const key = `${r.Role}_${r.A}_${r.W}_${r.ID}`;
        if (!map[key]) {
          map[key] = { Role: r.Role, A: r.A, W: r.W, ID: r.ID, mts: [] };
        }
        map[key].mts.push(r.MT);
      });

      let csv = "Role,A,W,ID,Mean_MT,Trials\n";
      Object.values(map).forEach(g => {
        const mean = (g.mts.reduce((sum, v) => sum + v, 0) / g.mts.length).toFixed(2);
        csv += `${g.Role},${g.A},${g.W},${g.ID},${mean},${g.mts.length}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const dlLink = document.createElement('a');
      dlLink.href = url;
      dlLink.download = "action_game_hud_fitts_law.csv";
      dlLink.click();
    }
  </script>
</body>
</html>
