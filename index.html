<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Game HUD Fitts' Law Study</title>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #111827;
      --panel-border: #1f2937;
      --attack: #ea580c;
      --attack-border: #fdba74;
      --audio: #334155;
      --audio-border: #64748b;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    /* Top Stats Bar */
    #top-bar {
      width: 900px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 20px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    #top-bar span {
      color: #fff;
      font-weight: 600;
    }

    /* Main Interaction Canvas */
    #game-canvas {
      position: relative;
      width: 900px;
      height: 540px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* Center Rest / Origin Station */
    #rest-station {
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 130px;
      height: 46px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--muted);
      cursor: pointer;
      z-index: 10;
      transition: all 0.15s ease;
    }
    #rest-station.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.5);
    }

    /* Target Buttons */
    .hud-target {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.05s ease;
    }
    .hud-target:active {
      transform: scale(0.95);
    }

    /* ATTACK Button: Highly visible, centered combat area */
    .target-attack {
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #ffffff;
      border: 2px solid var(--attack-border);
      box-shadow: 0 0 16px rgba(234, 88, 12, 0.45);
      letter-spacing: 1px;
    }

    /* SETTINGS Button: Compact, edge-positioned anti-misclick target */
    .target-settings {
      background: var(--audio);
      color: #cbd5e1;
      border: 1px solid var(--audio-border);
      box-shadow: 0 0 8px rgba(100, 116, 139, 0.25);
      letter-spacing: 0.5px;
    }

    .hidden {
      display: none !important;
    }

    /* Bottom Control Bar */
    #bottom-bar {
      width: 900px;
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #guidance {
      font-size: 13px;
      color: var(--muted);
    }

    .btn-action {
      border: none;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-start {
      background: var(--accent);
      color: #0b0f19;
    }
    .btn-export {
      background: var(--success);
      color: #ffffff;
      margin-left: 8px;
    }
    .btn-action:disabled {
      background: #374151;
      color: #6b7280;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Top Stats Bar -->
  <div id="top-bar">
    <div>Condition: <span id="lbl-cond">Idle</span></div>
    <div>Trials: <span id="lbl-trials">0/10</span></div>
    <div>Misses: <span id="lbl-miss" style="color:var(--danger)">0</span></div>
  </div>

  <!-- Interactive Area -->
  <div id="game-canvas">
    <div id="rest-station">REST POSITION</div>
    <div id="btn-attack" class="hud-target target-attack hidden">ATTACK</div>
    <div id="btn-settings" class="hud-target target-settings hidden">CONFIG</div>
  </div>

  <!-- Footer Actions -->
  <div id="bottom-bar">
    <div id="guidance">Click <strong>Start Session</strong> to begin.</div>
    <div>
      <button id="btn-start" class="btn-action btn-start" onclick="initStudy()">Start Session</button>
      <button id="btn-export" class="btn-action btn-export" disabled onclick="exportCSV()">Export Aggregated CSV</button>
    </div>
  </div>

  <script>
    // Independent Variables:
    // A: Amplitude distance from center rest station
    // W: Target width (Attack utilizes prominent W; Config utilizes small W)
    const distances = [150, 260, 360];
    const widths = [26, 52, 96]; // Small 26px (Config), Prominent 96px (Attack)
    const TAPS_PER_COND = 11;    // 1st Warm-up discarded, 10 valid taps recorded

    let conditions = [];
    distances.forEach(d => widths.forEach(w => conditions.push({ A: d, W: w })));

    let condIndex = 0;
    let clickCount = 0;
    let state = 'IDLE';
    let currentRole = 'ATTACK';
    let startTimestamp = 0;
    let rawRecords = [];
    let misses = 0;

    const canvas = document.getElementById('game-canvas');
    const restStation = document.getElementById('rest-station');
    const btnAttack = document.getElementById('btn-attack');
    const btnSettings = document.getElementById('btn-settings');
    const lblCond = document.getElementById('lbl-cond');
    const lblTrials = document.getElementById('lbl-trials');
    const lblMiss = document.getElementById('lbl-miss');
    const guidance = document.getElementById('guidance');
    const btnStart = document.getElementById('btn-start');
    const btnExport = document.getElementById('btn-export');

    function shuffle(arr) {
      return arr.sort(() => Math.random() - 0.5);
    }

    function setupCondition() {
      const c = conditions[condIndex];
      clickCount = 0;
      lblCond.textContent = `${condIndex + 1}/9 (A:${c.A}px, W:${c.W}px)`;
      lblTrials.textContent = `0/10`;

      // Small width represents peripheral Setting/Config; Large represents Primary Attack
      currentRole = c.W <= 52 ? 'CONFIG' : 'ATTACK';

      const activeEl = currentRole === 'ATTACK' ? btnAttack : btnSettings;
      const inactiveEl = currentRole === 'ATTACK' ? btnSettings : btnAttack;

      // Rest station center coordinates
      const restCenterX = 450;
      const restCenterY = 540 * 0.55;

      let targetX = 0;
      let targetY = 0;

      if (currentRole === 'ATTACK') {
        // ATTACK: Kept within prominent combat field (comfortably offset from center, not touching canvas edges)
        const side = Math.random() > 0.5 ? 1 : -1;
        targetX = restCenterX + (side * c.A) - (c.W / 2);
        targetY = restCenterY - (c.W * 0.35);
      } else {
        // CONFIG: Biased towards the upper periphery/edge corner to simulate game setting icons
        const cornerSide = Math.random() > 0.5 ? 1 : -1;
        targetX = restCenterX + (cornerSide * c.A) - (c.W / 2);
        // Positioned higher up near the edge
        targetY = Math.max(30, restCenterY - c.A * 0.75);
      }

      // Constrain within visible canvas boundaries
      targetX = Math.max(15, Math.min(900 - c.W - 15, targetX));
      targetY = Math.max(15, Math.min(540 - Math.max(30, c.W * 0.6) - 15, targetY));

      activeEl.style.width = `${c.W}px`;
      activeEl.style.height = `${Math.max(30, c.W * 0.65)}px`;
      activeEl.style.left = `${targetX}px`;
      activeEl.style.top = `${targetY}px`;
      activeEl.style.fontSize = c.W < 35 ? '9px' : '13px';
      activeEl.classList.remove('hidden');

      inactiveEl.classList.add('hidden');

      setStep('REST');
    }

    function setStep(next) {
      state = next;
      if (next === 'REST') {
        restStation.classList.add('active');
        btnAttack.style.pointerEvents = 'none';
        btnSettings.style.pointerEvents = 'none';
        guidance.textContent = "Click [REST POSITION] to center cursor.";
      } else {
        restStation.classList.remove('active');
        btnAttack.style.pointerEvents = 'auto';
        btnSettings.style.pointerEvents = 'auto';
        guidance.innerHTML = `Target: Click <strong style="color:${currentRole === 'ATTACK' ? 'var(--attack)' : '#cbd5e1'}">[${currentRole}]</strong>`;
        startTimestamp = performance.now();
      }
    }

    restStation.addEventListener('mousedown', () => {
      if (state !== 'REST') return;
      setStep('TARGET');
    });

    function handleTargetClick(role) {
      if (state !== 'TARGET') return;

      const now = performance.now();
      const c = conditions[condIndex];

      // Discard 1st warmup click; accumulate remaining 10 valid trials
      if (clickCount > 0) {
        const mt = Math.round(now - startTimestamp);
        const id = Math.log2((2 * c.A) / c.W);
        rawRecords.push({
          condIndex: condIndex + 1,
          Role: currentRole,
          A: c.A,
          W: c.W,
          ID: parseFloat(id.toFixed(3)),
          MT: mt
        });
      }

      clickCount++;
      lblTrials.textContent = `${Math.min(clickCount, 10)}/10`;

      if (clickCount >= TAPS_PER_COND) {
        condIndex++;
        if (condIndex < conditions.length) {
          setupCondition();
        } else {
          finishStudy();
        }
      } else {
        setStep('REST');
      }
    }

    btnAttack.addEventListener('mousedown', () => handleTargetClick('ATTACK'));
    btnSettings.addEventListener('mousedown', () => handleTargetClick('CONFIG'));

    // Accidental clicks on empty canvas background
    canvas.addEventListener('mousedown', (e) => {
      if (state === 'TARGET' && e.target === canvas) {
        misses++;
        lblMiss.textContent = misses;
        canvas.style.borderColor = '#ef4444';
        setTimeout(() => { canvas.style.borderColor = '#1f2937'; }, 120);
      }
    });

    function initStudy() {
      conditions = shuffle(conditions);
      condIndex = 0;
      misses = 0;
      rawRecords = [];
      btnStart.disabled = true;
      btnExport.disabled = true;
      lblMiss.textContent = '0';
      setupCondition();
    }

    function finishStudy() {
      restStation.classList.remove('active');
      btnAttack.classList.add('hidden');
      btnSettings.classList.add('hidden');
      lblCond.textContent = "Completed";
      guidance.innerHTML = "<span style='color:var(--success); font-weight:600;'>Session complete. Export aggregated data below.</span>";
      btnExport.disabled = false;
    }

    function exportCSV() {
      const map = {};
      rawRecords.forEach(r => {
        const key = `${r.Role}_${r.A}_${r.W}_${r.ID}`;
        if (!map[key]) {
          map[key] = { Role: r.Role, A: r.A, W: r.W, ID: r.ID, mts: [] };
        }
        map[key].mts.push(r.MT);
      });

      let csv = "Role,A,W,ID,Mean_MT,Trials\n";
      Object.values(map).forEach(g => {
        const mean = (g.mts.reduce((sum, v) => sum + v, 0) / g.mts.length).toFixed(2);
        csv += `${g.Role},${g.A},${g.W},${g.ID},${mean},${g.mts.length}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "action_game_hud_fitts_law.csv";
      a.click();
    }
  </script>
</body>
</html>
