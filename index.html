<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Action Game HUD: Anti-Misclick Fitts' Law Study</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --hud-panel: #131b2e;
      --attack-glow: #f97316;
      --attack-btn: #ea580c;
      --setting-btn: #475569;
      --setting-glow: #94a3b8;
      --accent: #38bdf8;
      --text-main: #f1f5f9;
      --danger: #ef4444;
      --success: #22c55e;
    }
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }
    header {
      width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 20px;
      margin: 0;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent);
    }
    .hud-stats {
      font-size: 14px;
      color: #94a3b8;
    }
    .hud-stats span {
      color: #fff;
      font-weight: bold;
      margin-right: 12px;
    }

    #game-canvas {
      position: relative;
      width: 900px;
      height: 520px;
      background: var(--hud-panel);
      border: 2px solid #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
    }

    /* Joystick / Rest Position */
    #rest-station {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 140px;
      height: 50px;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
      color: #94a3b8;
      cursor: pointer;
      z-index: 10;
      transition: all 0.15s ease;
    }
    #rest-station.ready {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.8);
      animation: pulse-hud 1.2s infinite alternate;
    }

    /* Target Buttons */
    .hud-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.05s;
    }
    .hud-btn:active {
      transform: translateY(-50%) scale(0.96);
    }

    /* Attack Button (Large W) */
    .btn-attack {
      background: linear-gradient(135deg, #f97316, #c2410c);
      color: #ffffff;
      border: 2px solid #fdba74;
      box-shadow: 0 0 14px rgba(249, 115, 22, 0.4);
      letter-spacing: 1px;
    }

    /* Settings Button (Small W to prevent accidental clicks) */
    .btn-settings {
      background: #334155;
      color: #cbd5e1;
      border: 2px solid #64748b;
      box-shadow: 0 0 8px rgba(100, 116, 139, 0.3);
      letter-spacing: 0.5px;
    }

    .btn-inactive {
      display: none !important;
    }

    #controls-bar {
      width: 900px;
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cmd-btn {
      background: var(--accent);
      color: #090d16;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .cmd-btn:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }
    .info-guide {
      font-size: 14px;
      color: #cbd5e1;
    }

    @keyframes pulse-hud {
      from { transform: translate(-50%, -50%) scale(1); }
      to { transform: translate(-50%, -50%) scale(1.06); }
    }
  </style>
</head>
<body>

  <header>
    <h1>Action Game HUD: Anti-Misclick Target Study</h1>
    <div class="hud-stats">
      Condition: <span id="cond-display">Ready</span>
      Taps: <span id="tap-display">0/10</span>
      Misses: <span id="miss-display" style="color:var(--danger)">0</span>
    </div>
  </header>

  <div id="game-canvas">
    <div id="rest-station">REST POSITION</div>
    <div id="btn-attack" class="hud-btn btn-attack btn-inactive">ATTACK</div>
    <div id="btn-settings" class="hud-btn btn-settings btn-inactive">AUDIO</div>
  </div>

  <div id="controls-bar">
    <div id="info-guide" class="info-guide">Click <strong>Start Experiment</strong> to initiate the session.</div>
    <div>
      <button id="start-btn" class="cmd-btn" onclick="beginExperiment()">Start Experiment</button>
      <button id="export-btn" class="cmd-btn" style="background:var(--success); color:#fff; margin-left:8px;" disabled onclick="exportAggregatedCSV()">Export Aggregated CSV</button>
    </div>
  </div>

  <script>
    // Independent Variables: 3 Distances (A) x 3 Target Widths (W) = 9 Conditions
    const distances = [160, 300, 460];  // A (px)
    const widths = [28, 56, 100];       // W (px): 28px for Audio/Settings (Small), 100px for Attack (Large)
    const TAPS_PER_CONDITION = 11;      // 1st click Warm-up (discarded), 10 valid recorded clicks

    let conditions = [];
    distances.forEach(d => widths.forEach(w => conditions.push({ A: d, W: w })));

    let currentCondIndex = 0;
    let clickInCondition = 0;
    let state = 'IDLE'; // 'REST' or 'ACTIVE_TARGET'
    let currentRole = 'ATTACK';
    let launchTime = 0;
    let rawRecords = [];
    let missCount = 0;

    const gameCanvas = document.getElementById('game-canvas');
    const restStation = document.getElementById('rest-station');
    const btnAttack = document.getElementById('btn-attack');
    const btnSettings = document.getElementById('btn-settings');
    const condDisplay = document.getElementById('cond-display');
    const tapDisplay = document.getElementById('tap-display');
    const missDisplay = document.getElementById('miss-display');
    const infoGuide = document.getElementById('info-guide');
    const startBtn = document.getElementById('start-btn');
    const exportBtn = document.getElementById('export-btn');

    function shuffleArray(arr) {
      return arr.sort(() => Math.random() - 0.5);
    }

    function setupCurrentCondition() {
      const c = conditions[currentCondIndex];
      clickInCondition = 0;
      condDisplay.textContent = `${currentCondIndex + 1}/9 (A:${c.A}px, W:${c.W}px)`;
      tapDisplay.textContent = `0/10`;

      // W <= 56 represents Settings/Audio (Prevent Misclick); W = 100 represents Primary Attack
      currentRole = c.W <= 56 ? 'AUDIO' : 'ATTACK';

      // Randomize target side: Left (-1) or Right (1)
      const side = Math.random() > 0.5 ? 1 : -1;
      const targetCenterX = 450 + (side * c.A);

      const activeEl = currentRole === 'ATTACK' ? btnAttack : btnSettings;
      const inactiveEl = currentRole === 'ATTACK' ? btnSettings : btnAttack;

      activeEl.style.width = `${c.W}px`;
      activeEl.style.height = `${Math.max(34, c.W * 0.65)}px`;
      activeEl.style.left = `${targetCenterX - (c.W / 2)}px`;
      activeEl.style.fontSize = c.W < 35 ? '10px' : '13px';
      activeEl.classList.remove('btn-inactive');

      inactiveEl.classList.add('btn-inactive');

      transitionTo('REST');
    }

    function transitionTo(nextState) {
      state = nextState;
      if (nextState === 'REST') {
        restStation.classList.add('ready');
        btnAttack.style.pointerEvents = 'none';
        btnSettings.style.pointerEvents = 'none';
        infoGuide.textContent = "Click [REST POSITION] to ready your cursor.";
      } else {
        restStation.classList.remove('ready');
        btnAttack.style.pointerEvents = 'auto';
        btnSettings.style.pointerEvents = 'auto';
        infoGuide.innerHTML = `Target Active: Hit <strong style="color:${currentRole === 'ATTACK' ? 'var(--attack-glow)' : 'var(--setting-glow)'}">[${currentRole}]</strong>!`;
        launchTime = performance.now();
      }
    }

    restStation.addEventListener('mousedown', () => {
      if (state !== 'REST') return;
      transitionTo('ACTIVE_TARGET');
    });

    function handleTargetHit(role) {
      if (state !== 'ACTIVE_TARGET') return;

      const now = performance.now();
      const c = conditions[currentCondIndex];

      // Discard the 1st tap (Warm-up/Initial indexing), record subsequent 10 taps
      if (clickInCondition > 0) {
        const mt = Math.round(now - launchTime);
        const id = Math.log2((2 * c.A) / c.W);
        rawRecords.push({
          condIndex: currentCondIndex + 1,
          Role: currentRole,
          A: c.A,
          W: c.W,
          ID: parseFloat(id.toFixed(3)),
          MT: mt
        });
      }

      clickInCondition++;
      tapDisplay.textContent = `${Math.min(clickInCondition, 10)}/10`;

      if (clickInCondition >= TAPS_PER_CONDITION) {
        currentCondIndex++;
        if (currentCondIndex < conditions.length) {
          setupCurrentCondition();
        } else {
          finishStudy();
        }
      } else {
        transitionTo('REST');
      }
    }

    btnAttack.addEventListener('mousedown', () => handleTargetHit('ATTACK'));
    btnSettings.addEventListener('mousedown', () => handleTargetHit('AUDIO'));

    // Accidental clicks on blank canvas recorded as Misses
    gameCanvas.addEventListener('mousedown', (e) => {
      if (state === 'ACTIVE_TARGET' && e.target === gameCanvas) {
        missCount++;
        missDisplay.textContent = missCount;
        gameCanvas.style.borderColor = '#ef4444';
        setTimeout(() => { gameCanvas.style.borderColor = '#1e293b'; }, 150);
      }
    });

    function beginExperiment() {
      conditions = shuffleArray(conditions);
      currentCondIndex = 0;
      missCount = 0;
      rawRecords = [];
      startBtn.disabled = true;
      exportBtn.disabled = true;
      missDisplay.textContent = '0';
      setupCurrentCondition();
    }

    function finishStudy() {
      restStation.classList.remove('ready');
      btnAttack.classList.add('btn-inactive');
      btnSettings.classList.add('btn-inactive');
      condDisplay.textContent = "Completed";
      infoGuide.innerHTML = "<span style='color:var(--success); font-weight:bold;'>Experiment Complete! Click Export to download aggregated CSV data.</span>";
      exportBtn.disabled = false;
    }

    function exportAggregatedCSV() {
      // Group by Condition to calculate Mean MT (guarantees robust R^2)
      const conditionMap = {};
      rawRecords.forEach(r => {
        const key = `${r.Role}_${r.A}_${r.W}_${r.ID}`;
        if (!conditionMap[key]) {
          conditionMap[key] = { Role: r.Role, A: r.A, W: r.W, ID: r.ID, mts: [] };
        }
        conditionMap[key].mts.push(r.MT);
      });

      let csv = "Role,A,W,ID,Mean_MT,Trials\n";
      Object.values(conditionMap).forEach(group => {
        const mean = (group.mts.reduce((sum, v) => sum + v, 0) / group.mts.length).toFixed(2);
        csv += `${group.Role},${group.A},${group.W},${group.ID},${mean},${group.mts.length}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const dlLink = document.createElement('a');
      dlLink.href = url;
      dlLink.download = "action_game_hud_fitts_law.csv";
      dlLink.click();
    }
  </script>
</body>
</html>
